apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tomcat-demo
spec:
  # Set ingressClassName to your installed controller's class if no default exists.
  rules:
    - host: tomcat.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tomcat-demo
                port:
                  name: http
