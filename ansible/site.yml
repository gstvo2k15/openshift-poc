---
- name: Validate local tooling and deploy base namespaces
  hosts: local
  gather_facts: false
  tasks:
    - name: Check Kubernetes connectivity
      ansible.builtin.command: kubectl cluster-info
      changed_when: false
    - name: Apply namespaces with Terraform
      ansible.builtin.command: terraform apply -auto-approve -var=kubeconfig={{ lookup('env', 'KUBECONFIG') | default(lookup('env', 'HOME') + '/.kube/config', true) }}
      args:
        chdir: "{{ playbook_dir }}/../terraform"
      register: terraform_result
      changed_when: "'Apply complete! Resources: 0 added, 0 changed, 0 destroyed' not in terraform_result.stdout"
    - name: Display Kubernetes namespaces
      ansible.builtin.command: kubectl get namespaces devsecops-demo ci-jenkins poc-observability
      changed_when: false
